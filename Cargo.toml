[workspace]
resolver = "2"
members = [
    "crates/tokenopt-core",
    "crates/tokenopt-cli",
]
exclude = ["bindings/*"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
regex = "1.0"
lru = "0.10"
dashmap = "5.0"
tiktoken-rs = "0.4"
similar = "2.0"
textwrap = "0.16"