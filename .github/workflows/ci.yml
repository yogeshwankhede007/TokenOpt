name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Code Quality & Linting
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check docs
        run: cargo doc --workspace --all-features --no-deps --document-private-items

  # Security Auditing
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit --deny warnings
      - name: Check for vulnerable dependencies
        run: cargo deny check advisories

  # Unit & Integration Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@${{ matrix.rust }}
      - name: Run tests
        run: cargo test --workspace --all-features -- --test-threads=4
      - name: Run doc tests
        run: cargo test --workspace --all-features --doc

  # Property-based Testing
  proptest:
    name: Property-based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run proptest
        run: cargo test --workspace --all-features proptest -- --test-threads=4

  # Benchmarks
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmarks
        run: cargo bench --workspace --all-features -- --save-baseline main
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 30

  # Build All Targets
  build:
    name: Build All Targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --all-features --target ${{ matrix.target }} --release
      - name: Verify CLI builds
        run: cargo build --bin tokenopt --target ${{ matrix.target }} --release

  # Python Bindings Tests
  python-test:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install maturin[patchelf]
      - name: Build Python package
        run: |
          cd bindings/python
          maturin develop --release
      - name: Run Python tests
        run: |
          cd bindings/python
          pip install pytest pytest-asyncio
          pytest -v || echo "Python tests placeholder"

  # TypeScript/Node.js Bindings Tests
  typescript-test:
    name: TypeScript Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build NAPI bindings
        run: |
          cargo build --workspace --features napi --release
      - name: Install npm dependencies
        run: |
          cd bindings/typescript
          npm ci
      - name: Build TypeScript
        run: |
          cd bindings/typescript
          npm run build
      - name: Run TypeScript tests
        run: |
          cd bindings/typescript
          npm test || echo "TypeScript tests placeholder"

  # Dependency Review
  deps:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for outdated deps
        run: cargo outdated --workspace --exit-code 1 || true
      - name: Check license compliance
        run: cargo deny check licenses

  # Release
  release:
    name: Create Release
    needs: [lint, security, test, benchmark, build, python-test, typescript-test, deps]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release artifacts
        run: |
          cargo build --workspace --all-features --release
          cargo build --bin tokenopt --release
      - name: Package CLI
        run: |
          mkdir -p release
          cp target/release/tokenopt release/tokenopt-linux-x86_64
          tar -czf tokenopt-linux-x86_64.tar.gz -C release tokenopt-linux-x86_64
      - name: Publish to crates.io
        if: env.CRATES_IO_TOKEN != ''
        run: cargo publish --workspace --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tokenopt-linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notify on failure
  notify:
    name: Notify Failure
    needs: [lint, security, test, benchmark, build, python-test, typescript-test, deps]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: echo "Build failed - notify team"