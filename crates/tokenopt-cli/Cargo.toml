[package]
name = "tokenopt-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for TokenOpt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourorg/tokenoptimization"

[[bin]]
name = "tokenopt"
path = "src/main.rs"

[dependencies]
tokenopt-core = { path = "../tokenopt-core" }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
colored = "2.0"
indicatif = "0.17"
tabled = "0.16"