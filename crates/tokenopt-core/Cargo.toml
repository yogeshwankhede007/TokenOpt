[package]
name = "tokenopt-core"
version = "0.1.0"
edition = "2021"
description = "Core token optimization library for LLM coding assistants"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourorg/tokenoptimization"

[lib]
name = "tokenopt_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["tiktoken"]
python = ["pyo3", "pyo3-stub-gen"]
wasm = []
napi = ["napi"]
tiktoken = ["tiktoken-rs"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
lru = { workspace = true }
dashmap = { workspace = true }
tiktoken-rs = { workspace = true, optional = true }
similar = { workspace = true }
textwrap = { workspace = true }
regex = { workspace = true }
once_cell = "1.0"
parking_lot = "0.12"
hashbrown = "0.14"
xxhash-rust = "0.8"
bstr = "1.0"
memchr = "2.0"
ahash = "0.8"
smallvec = "1.0"
smartstring = "1.0"

# Python bindings
pyo3 = { version = "0.21", optional = true, features = ["extension-module", "abi3-py38", "generate-abi3"] }
pyo3-stub-gen = { version = "0.5", optional = true }

# NAPI bindings for Node.js
napi = { version = "2.0", optional = true }
napi-derive = { version = "2.0", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.21", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tempfile = "3.0"